name: Build & Deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Group per ref so branch builds don't cancel a main deploy (and vice versa).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      # Downloadable build for ANY branch: grab this from the run's "Artifacts"
      # section, unzip, and open index.html locally (asset paths are relative,
      # so it works straight from the filesystem).
      - name: Upload built site (downloadable from any branch)
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: ./dist
          if-no-files-found: error
          retention-days: 30

      # Pages artifact + config are only needed for the deploy on main.
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
